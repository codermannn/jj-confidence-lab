[project]
name = "jj-confidence-lab"
version = "0.1.0"
description = "Disposable experimental Git and Jujutsu laboratory"
requires-python = ">=3.13,<3.14"
dependencies = ["typer>=0.16,<1", "rich>=14,<15"]
license = "MIT"

[project.scripts]
lab = "jj_lab.cli:main"

[build-system]
requires = ["uv_build==0.11.3"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-name = "jj_lab"

[dependency-groups]
dev = ["pytest>=8,<10", "ruff>=0.11,<1"]

[tool.ruff]
line-length = 100
extend-exclude = [".lab", "artifacts"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
